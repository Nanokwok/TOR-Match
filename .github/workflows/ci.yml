name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Playwright is a backend devDependency for the TOR scraper. CI only typechecks
# and builds, so it never needs the ~300MB of browser binaries the package
# downloads on install.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # npm workspaces: one lockfile at the root installs both packages.
      - run: npm ci

      # Next generates route/layout types (LayoutProps, PageProps) into .next/types.
      # They are gitignored, so tsc cannot resolve them on a fresh checkout.
      - name: Generate route types
        run: npx next typegen
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Test
        run: npm run test --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
        env:
          # The build only needs the variable to exist; no backend is reachable here.
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          AUTH_COOKIE_NAME: tm_token

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      - name: Lint
        run: npm run lint --workspace backend

      - name: Test
        run: npm run test --workspace backend

      - name: Build
        run: npm run build --workspace backend

  # The patching policy (docs/security/vulnerability-management-and-sbom.md) says a
  # High or Critical advisory with a fix available in a production dependency blocks the build.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history to scan commits, not just the current tree.
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must never be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No .env files are tracked."

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}